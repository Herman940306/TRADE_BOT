# ============================================================
# Ruff Configuration - Project Autonomous Alpha
# Sovereign Tier | Zero-Float Mandate Enforced
# ============================================================

# Target Python 3.9 (NAS deployment target)
target-version = "py39"
line-length = 88

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear (catches common bugs)
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "S",    # flake8-bandit (security)
    "T20",  # flake8-print (no stray print statements)
    "PIE",  # flake8-pie
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "ERA",  # eradicate (commented-out code)
    "PL",   # pylint
]

ignore = [
    "S101",   # assert statements (used in tests)
    "S105",   # hardcoded passwords (false positives on env var names)
    "S106",   # hardcoded passwords in function args
    "PLR0913", # too many arguments (complex financial functions need them)
    "PLR2004", # magic value comparisons (financial constants are intentional)
    "ERA001",  # commented-out code (some are intentional docs)
]

# Never auto-fix these — require human review
unfixable = [
    "F401",  # unused imports (may be re-exports)
    "ERA001", # commented code
]

[lint.per-file-ignores]
# Tests can use assert and print
"**/tests/**" = ["S101", "T20", "PLR2004"]
"**/test_*.py" = ["S101", "T20", "PLR2004"]

[lint.isort]
known-first-party = ["app", "data_ingestion", "aura_bridge"]
force-sort-within-sections = true

[lint.flake8-bugbear]
extend-immutable-calls = ["decimal.Decimal"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
