# ============================================================================
# Project Autonomous Alpha v1.9.0
# GitHub Actions NAS Deployment - Sovereign Tier
# ============================================================================
#
# Reliability Level: SOVEREIGN TIER
# Purpose: Deploy the latest Docker image to the Synology NAS automatically
#          after every successful push to main, making the GitHub repository
#          the single source of truth and eliminating the need to build
#          locally on a degraded drive.
#
# Prerequisites (configure once in GitHub → Settings → Secrets & Variables):
#   NAS_HOST          — NAS IP or hostname (e.g. 192.168.1.100)
#   NAS_USER          — SSH user on the NAS (e.g. admin)
#   NAS_SSH_KEY       — Private SSH key for password-less login
#   NAS_DEPLOY_PATH   — Absolute path on NAS (e.g. /volume2/docker/autonomous_alpha)
#
# Trigger:
#   - Automatically after the "Docker Build & Publish" workflow completes
#     successfully on the main branch.
#   - Manual dispatch (workflow_dispatch) for ad-hoc deployments.
#
# What it does on the NAS:
#   1. Pulls the latest image from GHCR (no local build required).
#   2. Runs docker-compose to apply changes.
#   3. Removes dangling images to reclaim disk space.
#
# ============================================================================

name: Deploy to NAS

on:
  workflow_run:
    workflows: ["Docker Build & Publish"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy (default: latest)"
        required: false
        default: "latest"

jobs:
  # ==========================================================================
  # JOB: DEPLOY TO SYNOLOGY NAS
  # ==========================================================================
  deploy:
    name: Deploy to Synology NAS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Only run when triggered by a successful Docker build, or on manual dispatch
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    environment:
      name: production
      url: "http://${{ secrets.NAS_HOST }}:8080"

    steps:
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.NAS_SSH_KEY }}

      - name: Add NAS host to known_hosts
        run: |
          ssh-keyscan -H "${{ secrets.NAS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy latest image on NAS
        env:
          NAS_HOST: ${{ secrets.NAS_HOST }}
          NAS_USER: ${{ secrets.NAS_USER }}
          NAS_DEPLOY_PATH: ${{ secrets.NAS_DEPLOY_PATH }}
          IMAGE_TAG: ${{ github.event.inputs.image_tag || 'latest' }}
          REGISTRY: ghcr.io
          IMAGE_NAME: ${{ github.repository_owner }}/trade_bot
        run: |
          ssh "$NAS_USER@$NAS_HOST" \
            NAS_DEPLOY_PATH="$NAS_DEPLOY_PATH" \
            IMAGE_TAG="$IMAGE_TAG" \
            REGISTRY="$REGISTRY" \
            IMAGE_NAME="$IMAGE_NAME" \
            bash << 'REMOTE_SCRIPT'
              set -euo pipefail
              echo "=== Autonomous Alpha NAS Deploy ==="
              echo "Deploy path : ${NAS_DEPLOY_PATH}"
              echo "Image tag   : ${IMAGE_TAG}"
              echo ""

              cd "${NAS_DEPLOY_PATH}"

              echo "[1/3] Pulling latest image..."
              docker pull "${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"

              echo "[2/3] Restarting services..."
              docker-compose -f docker-compose.prod.yml up -d --remove-orphans

              echo "[3/3] Cleaning up dangling images..."
              docker image prune -f

              echo ""
              echo "=== Deploy complete ==="
              docker-compose -f docker-compose.prod.yml ps
          REMOTE_SCRIPT
