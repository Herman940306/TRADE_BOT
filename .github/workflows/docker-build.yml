# ============================================================================
# Project Autonomous Alpha v1.9.0
# GitHub Actions Docker Build & Publish - Sovereign Tier
# ============================================================================
#
# Reliability Level: SOVEREIGN TIER
# Purpose: Build the production Docker image and push it to GitHub Container
#          Registry (GHCR) so that the NAS can pull the latest image without
#          requiring a local build.
#
# Triggers:
#   - Push to main (publishes image tagged `latest` and `sha-<commit>`)
#   - Push of a semver tag (publishes image tagged with the version)
#   - Pull requests targeting main (build only — no push)
#
# Image: ghcr.io/herman940306/trade_bot:<tag>
#
# NAS Usage:
#   docker pull ghcr.io/herman940306/trade_bot:latest
#   docker-compose -f docker-compose.prod.yml pull && \
#   docker-compose -f docker-compose.prod.yml up -d
#
# ============================================================================

name: Docker Build & Publish

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/trade_bot

jobs:
  # ==========================================================================
  # JOB: BUILD (and optionally PUSH) DOCKER IMAGE
  # ==========================================================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            GIT_SHA=${{ github.sha }}
            GIT_REF=${{ github.ref_name }}
