# ===========================================================================
# DOMAIN SECURITY CONSIDERATIONS
# ===========================================================================
domain_security_considerations:
  sensitive_areas:
    - area: "OpenRouter API Key"
      location: "env var OPENROUTER_API_KEY, used in Bearer token"
      concern: "Passed as header — logged indirectly if error responses include headers"
    - area: "LLM Prompt Injection"
      location: "BULL/BEAR prompt templates accept raw signal data"
      concern: |
        Signal fields (symbol, price, quantity) are interpolated directly into prompts
        via f-string format. While these come from HMAC-verified TradingView payloads,
        a compromised TV account could inject malicious prompt content.
    - area: "Debate Reasoning Stored in DB"
      location: "ai_debates table"
      concern: "LLM outputs stored directly — could contain unexpected content if model misbehaves"
  authentication_patterns_in_domain: "OpenRouter uses Bearer token. Ollama uses unauthenticated HTTP (internal Docker network)"
  authorization_patterns_in_domain: "No authorization on Ollama calls — relies on Docker network isolation"
  data_validation_in_domain: "Signal validated by Pydantic before AI path. LLM output validated only by regex verdict parsing"

