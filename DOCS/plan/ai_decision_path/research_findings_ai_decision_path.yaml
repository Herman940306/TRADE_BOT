# ===========================================================================
# OPEN QUESTIONS
# ===========================================================================
open_questions:
  - question: "Why is ollama_context_builder.build_context_block() not called in webhook hot path?"
    context: |
      The context builder exists (600 char budget, DB-aware) but is never imported or called
      in webhook.py. The AI Council prompts only contain raw signal fields.
      This means the LLM has NO awareness of: execution mode, guardian state, recent debates.

  - question: "Why is PreTradeAuditModule not wired into the hot path?"
    context: |
      A fully-implemented adversarial audit module exists using DeepSeek-R1 with 3-rejection-reason
      protocol, but it's completely disconnected from the webhook flow. Was this intentional
      (future phase) or an integration gap?

  - question: "Why is sovereign_intel.gather_predictive_context() not called before debates?"
    context: |
      The intelligence gathering function exists (RAG + ML + RGI + historical win rate)
      and it even has a to_prompt_context() method for injection. Not called anywhere in
      the active trading path.

  - question: "Why does AI_CONSENSUS_THRESHOLD env var exist if consensus logic is hardcoded to unanimous?"
    context: |
      .env.example sets AI_CONSENSUS_THRESHOLD=60 but the actual code requires BOTH models
      to return APPROVED (consensus_score=100). The threshold env var is never referenced in code.

  - question: "What happens when Ollama is cold and both bull/bear requests time out at 60s?"
    context: |
      The webhook handler awaits conduct_debate which runs both calls concurrently.
      If Ollama needs to load the model (cold start), the first request can take 30-120s.
      Meanwhile the TradingView webhook times out and the signal is effectively lost
      (trade rejected but no retry mechanism exists).

# ===========================================================================
# GAPS
# ===========================================================================
gaps:
  - area: "Token Budget Management"
    description: |
      No token counting anywhere in the codebase. System prompt budget is 512 CHARACTERS
      (not tokens). Context builder budget is 600 CHARACTERS. Prompt templates have no
      budget. There's no way to know if prompts exceed the model's context window.
      qwen3:8b has 32K context, but without counting, a future prompt expansion could
      silently truncate.
    impact: "Silent context truncation if prompts grow beyond model limits"

  - area: "Retry Logic"
    description: |
      Zero retry logic for LLM calls. A single transient failure (rate limit, network
      timeout, Ollama cold start, DNS resolution) results in immediate ModelVerdict.ERROR
      → consensus_score=0 → REJECTED. No exponential backoff, no circuit breaker for AI calls.
    impact: "Transient failures permanently reject valid trade signals"

  - area: "Output Schema Validation"
    description: |
      LLM output is parsed with regex ("VERDICT: APPROVED" or "VERDICT: REJECTED").
      No JSON mode, no structured output, no Pydantic model for responses. The fallback
      heuristic (looking for APPROVED/REJECTED anywhere) is fragile — a model saying
      "I would have APPROVED but conditions require REJECTED" could confuse the parser.
    impact: "Model output format changes could cause misclassified verdicts"

  - area: "Prompt Versioning"
    description: |
      System prompt has manual v1.0.0 comment. Bull/Bear templates are inline Python strings.
      No version hash, no audit log of which prompt version produced which verdict.
      Changes to prompts are invisible to the audit trail.
    impact: "Cannot correlate verdict quality changes to prompt modifications"

  - area: "Context Builder Integration"
    description: |
      Three context enrichment modules exist (ollama_context_builder, sovereign_intel,
      debate_memory) but NONE are called in the production webhook path. The AI models
      make decisions with only raw signal data and no historical context.
    impact: "AI decisions lack available historical context"

  - area: "Model Fallback"
    description: |
      If primary OpenRouter model (mistral-7b) is unavailable, there's no fallback
      to secondary model. If Ollama model isn't loaded, debate fails with ERROR.
      No model health check before debate attempt.
    impact: "Single model failure causes complete AI path failure"

  - area: "Latency Budget"
    description: |
      Webhook should acknowledge in <50ms (per docstring) but AI debate is synchronous
      in the request path. Ollama timeout is 60s. OpenRouter timeout is 30s. Two concurrent
      calls. Worst case: 60s for Ollama, 30s for OpenRouter. No async decoupling.
    impact: "TradingView webhook timeout, lost signals during high latency"

  - area: "Duplicate AI Council Implementations"
    description: |
      AICouncil (OpenRouter) and OllamaAICouncil (Ollama) have duplicated logic for
      verdict parsing, consensus computation, and debate orchestration. The parse_verdict
      methods have DIFFERENT fallback behaviors (REJECTED vs UNCERTAIN).
    impact: "Behavioral inconsistency between cloud and local AI paths"
