# ===========================================================================
# PATTERNS FOUND
# ===========================================================================
patterns_found:
  - category: architecture
    pattern: "Dual AI Backend (OpenRouter + Ollama)"
    description: |
      Two completely separate AI backends share prompt templates but have different
      implementations, timeouts, error handling, and verdict parsing behaviors.
      Selection via USE_LOCAL_OLLAMA env var. Factory returns a CLASS not an instance.
    examples:
      - file: app/logic/ai_council.py
        location: "line 930-950"
        snippet: 'use_ollama = os.getenv("USE_LOCAL_OLLAMA", "").lower() in ("true", "1", "yes")'
    prevalence: common

  - category: architecture
    pattern: "Synchronous AI in Request Path"
    description: |
      AI debate is executed SYNCHRONOUSLY in the webhook request handler.
      The HTTP response is blocked until both bull and bear models respond.
      With 60s Ollama timeout, webhook can take >120s in worst case.
    examples:
      - file: app/api/webhook.py
        location: "line 508"
        snippet: "debate_result = await council.conduct_debate(...)"
    prevalence: common

  - category: error_handling
    pattern: "Fail-Closed Default"
    description: |
      All AI paths default to REJECTED on any error: timeout, parse failure,
      empty response, HTTP error, unexpected exception. This is intentionally
      conservative for capital preservation.
    examples:
      - file: app/logic/ai_council.py
        location: "line 390-415"
        snippet: "return ModelVerdict.REJECTED  # FINANCIAL GUARDRAIL"
    prevalence: common

  - category: error_handling
    pattern: "No Retry Logic"
    description: |
      Neither OpenRouter nor Ollama calls include any retry mechanism.
      A single transient failure (network blip, rate limit, cold start)
      results in immediate REJECTED verdict with no recovery attempt.
    examples:
      - file: app/logic/ai_council.py
        location: "line 345-370"
        snippet: "return error_msg, ModelVerdict.ERROR"
    prevalence: common

  - category: naming
    pattern: "Inconsistent Parse Behavior Between Backends"
    description: |
      AICouncil._parse_verdict defaults to REJECTED on ambiguity.
      OllamaAICouncil._parse_verdict defaults to UNCERTAIN (which then maps to 0/False in consensus).
      While both result in rejection, the path through consensus differs.
    examples:
      - file: app/logic/ai_council.py
        location: "line 415 vs line 800"
        snippet: "return ModelVerdict.REJECTED vs return ModelVerdict.UNCERTAIN"
    prevalence: occasional

  - category: architecture
    pattern: "Context Builder Not Wired"
    description: |
      ollama_context_builder.py exists and can inject DB-aware context (execution mode,
      guardian state, recent debates). sovereign_intel.py can gather RAG + ML context.
      NEITHER is called in the webhook hot path — prompts contain only raw signal data.
    examples:
      - file: app/api/webhook.py
        location: "line 504-530"
        snippet: "No import or call to build_context_block or gather_predictive_context"
    prevalence: rare

  - category: architecture
    pattern: "Pre-Trade Audit Disconnected"
    description: |
      PreTradeAuditModule in pre_trade_audit.py uses DeepSeek-R1 for adversarial reasoning
      but is NOT imported or called in webhook.py or any hot path code. It appears to be
      a standalone module for potential future use.
    examples:
      - file: app/api/webhook.py
        location: "imports section"
        snippet: "No import of pre_trade_audit"
    prevalence: rare

  - category: structure
    pattern: "No Token Counting"
    description: |
      No tiktoken, no token estimation, no context window management anywhere in the codebase.
      The only budget guards are: 512 char system prompt cap and 600 char context builder cap.
      These are CHARACTER budgets, not token budgets.
    examples:
      - file: app/logic/ai_council.py
        location: "line 134"
        snippet: "_SYSTEM_PROMPT_BUDGET: int = 512  # chars, not tokens"
    prevalence: rare

  - category: structure
    pattern: "No Output Schema Validation"
    description: |
      LLM responses are parsed with regex looking for "VERDICT: APPROVED/REJECTED".
      There is no JSON schema validation, no structured output format, no Pydantic model
      for LLM responses. The PreTradeAuditModule has slightly better parsing (structured
      REJECTION_REASON_N fields) but also regex-based.
    examples:
      - file: app/logic/ai_council.py
        location: "line 372-420"
        snippet: 'if "VERDICT: APPROVED" in content_upper'
    prevalence: common

  - category: structure
    pattern: "No Prompt Versioning"
    description: |
      System prompt has a version comment (v1.0.0) but no programmatic versioning.
      Bull/Bear prompt templates are inline Python strings with no version tracking.
      No prompt hash logging for audit trail.
    examples:
      - file: app/prompts/ai_council_system_prompt.txt
        location: "line 1"
        snippet: "# SYSTEM PROMPT v1.0.0"
    prevalence: rare

  - category: error_handling
    pattern: "Broad Exception Catching"
    description: |
      AI calls catch generic Exception as final handler, which masks specific
      failure modes (DNS resolution, SSL errors, JSON decode, OOM).
    examples:
      - file: app/logic/ai_council.py
        location: "line 365"
        snippet: "except Exception as e:"
    prevalence: common

