plan_id: ai-decision-path-audit
objective: "Comprehensive audit of the AI/LLM decision-making path in Trade_Bot"
focus_area: "AI Council, Ollama Integration, Prompt Engineering, Output Parsing, Context Building, Model Configuration"
created_at: "2026-03-29T00:00:00Z"
created_by: gem-researcher
status: completed

tldr: |
  - TWO parallel AI paths exist: OpenRouter (cloud, free-tier models) and Ollama (local GPU, qwen3:8b). Selected by USE_LOCAL_OLLAMA env var.
  - Hot path: webhook.py → risk_manager → ai_council.conduct_debate() → HITL gateway. AI debate is SYNCHRONOUS in the request path with 30-60s timeout.
  - CRITICAL: No token counting, no context window management, no output schema validation, no prompt versioning, no retry logic for LLM calls.
  - Pre-Trade Audit module (DeepSeek-R1) exists separately but is NOT wired into webhook hot path — appears unused in production.
  - Verdict parsing is regex-based ("VERDICT: APPROVED/REJECTED") with fallback heuristics — fragile against model output variations.

research_metadata:
  methodology: "Hybrid retrieval: semantic_search + grep_search across all Python files, read_file for complete contents of 15+ files, relationship discovery via import tracing"
  scope: "All AI/LLM-related files across app/logic/, app/api/, app/prompts/, aura_bridge/, services/, docker-compose configs, env templates"
  confidence: high
  coverage: 95

